<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First Boot Linux</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cantarell:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- GNOME-style top panel -->
  <header class="top-bar" role="banner">
    <div class="top-bar-left">
      <button type="button" class="app-menu-btn" id="epiphany-btn" title="Epiphany" aria-label="Epiphany web browser">
        <img class="app-menu-icon" src="assets/apps/epiphany.png" alt="" draggable="false" />
        <span class="app-menu-label">Epiphany</span>
      </button>
    </div>

    <div class="clock-display" id="clock-btn" aria-label="Date and time">
      <span id="clock-text">—</span>
    </div>

    <div class="status-area">
      <button
        type="button"
        class="system-menu-btn"
        id="system-menu-btn"
        aria-expanded="false"
        aria-controls="quick-settings"
        title="System menu"
      >
        <span class="status-icons" aria-hidden="true">
          <img class="status-icon sym" id="net-status-icon" src="assets/status/network-offline-symbolic.svg" alt="" draggable="false" />
          <img class="status-icon sym" src="assets/status/system-shutdown-symbolic.svg" alt="" draggable="false" />
        </span>
      </button>
    </div>
  </header>

  <!-- Quick Settings (network + power entry points) -->
  <div class="quick-settings" id="quick-settings" role="dialog" aria-label="Quick Settings" hidden>
    <div class="qs-toolbar">
      <div class="qs-toolbar-group">
        <button type="button" class="qs-round-btn" title="Settings" aria-label="Settings" disabled>
          <img class="sym" src="assets/status/cog-wheel-symbolic.svg" alt="" draggable="false" />
        </button>
      </div>
      <div class="qs-toolbar-group">
        <button type="button" class="qs-round-btn" id="power-menu-btn" title="Power Off" aria-label="Power menu" aria-haspopup="true">
          <img class="sym" src="assets/status/system-shutdown-symbolic.svg" alt="" draggable="false" />
        </button>
      </div>
    </div>

    <div class="qs-toggles">
      <button type="button" class="qs-toggle has-menu" id="network-toggle" data-toggle="network" aria-pressed="false">
        <span class="qs-toggle-main">
          <img class="sym" id="qs-net-icon" src="assets/status/network-wired-symbolic.svg" alt="" draggable="false" />
          <span class="qs-toggle-text">
            <span class="qs-toggle-label" id="qs-net-label">Network</span>
            <span class="qs-toggle-sub" id="qs-net-sub">Off</span>
          </span>
        </span>
        <img class="sym sym-sm qs-toggle-chevron" src="assets/status/go-next-symbolic.svg" alt="" draggable="false" />
      </button>

      <button type="button" class="qs-toggle active" id="dark-mode-toggle" data-toggle="dark" aria-pressed="true">
        <span class="qs-toggle-main">
          <img class="sym" src="assets/status/dark-mode-symbolic.svg" alt="" draggable="false" />
          <span class="qs-toggle-text">
            <span class="qs-toggle-label">Dark Style</span>
          </span>
        </span>
      </button>
    </div>
  </div>

  <!-- Network submenu -->
  <div class="network-menu" id="network-menu" role="dialog" aria-label="Network" hidden>
    <div class="menu-header">
      <button type="button" class="menu-back" id="network-back" aria-label="Back">
        <img class="sym" src="assets/status/go-next-symbolic.svg" alt="" draggable="false" style="transform: scaleX(-1)" />
      </button>
      <span>Network</span>
    </div>

    <div class="net-block">
      <div class="net-row">
        <div class="net-row-text">
          <div class="net-name">Ethernet</div>
          <div class="net-detail" id="ethernet-detail">Cable unplugged</div>
        </div>
        <button type="button" class="btn-pill" id="ethernet-toggle">Connect</button>
      </div>
    </div>

    <div class="net-block">
      <div class="net-section-label">Wi‑Fi</div>
      <ul class="wifi-list" id="wifi-list"></ul>
    </div>
  </div>

  <!-- Power menu -->
  <div class="power-menu" id="power-menu" role="menu" aria-label="Power Off" hidden>
    <div class="power-menu-header" role="presentation">
      <img class="sym" src="assets/status/system-shutdown-symbolic.svg" alt="" draggable="false" />
      <span>Power Off</span>
    </div>
    <button type="button" class="power-menu-item" data-power="restart" role="menuitem">Restart…</button>
    <button type="button" class="power-menu-item" data-power="shutdown" role="menuitem">Power Off…</button>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>

  <main class="main" id="main">
    <section class="screen" id="screen-chooser" aria-labelledby="chooser-title">
      <h1 id="chooser-title">Install a distro</h1>

      <h2 class="section-title">Recommended by <span class="retailer-name">Retailer Name</span></h2>
      <div class="distro-grid" id="recommended-grid" role="list"></div>

      <div class="other-cta">
        <button type="button" class="btn btn-secondary" id="view-other-btn" aria-expanded="false" aria-controls="catalog">
          <span id="view-other-label">View other distros</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>
      </div>

      <section class="catalog" id="catalog" hidden aria-labelledby="catalog-title">
        <h2 class="section-title" id="catalog-title">Other distros</h2>
        <div class="catalog-scroll" id="catalog-scroll">
          <div class="catalog-list" id="catalog-list" role="list"></div>
        </div>
      </section>
    </section>

    <section class="screen" id="screen-detail" hidden aria-labelledby="detail-title">
      <button type="button" class="back-link" id="detail-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polyline points="15 18 9 12 15 6" />
        </svg>
        Back
      </button>

      <div class="detail-card">
        <div class="detail-hero">
          <img class="distro-logo large" id="detail-logo" src="" alt="" />
          <div>
            <h1 id="detail-title">Distro</h1>
            <p class="detail-desktop" id="detail-desktop" hidden></p>
            <p class="detail-version" id="detail-version"></p>
            <p class="detail-tagline" id="detail-tagline"></p>
          </div>
        </div>

        <p class="detail-desc" id="detail-desc"></p>

        <div class="de-options" id="de-options" hidden>
          <div class="de-options-label">Desktop environment</div>
          <div class="de-options-list" id="de-options-list" role="list" aria-label="Desktop environments"></div>
        </div>

        <div class="detail-warn" id="detail-warn" hidden>
          <span id="detail-warn-text"></span>
        </div>

        <div class="detail-actions" id="detail-actions">
          <button type="button" class="btn btn-primary" id="install-btn">Install</button>
          <button type="button" class="btn btn-ghost" id="cancel-detail-btn">Cancel</button>
        </div>
      </div>
    </section>

    <section class="screen" id="screen-install" hidden aria-labelledby="install-title">
      <div class="install-panel">
        <img class="distro-logo large" id="install-logo" src="" alt="" />
        <h1 id="install-title">Installing…</h1>
        <p class="install-sub" id="install-subtitle"></p>

        <div class="progress-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar">
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="progress-meta">
            <span id="progress-label">0%</span>
            <span id="progress-step"></span>
          </div>
        </div>
      </div>
    </section>

    <section class="screen" id="screen-done" hidden aria-labelledby="done-title">
      <div class="done-panel">
        <div class="done-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12" />
          </svg>
        </div>
        <h1 id="done-title">You're all set</h1>
        <p class="done-msg" id="done-message"></p>
        <button type="button" class="btn btn-primary" id="reboot-btn">Restart now</button>
      </div>
    </section>
  </main>

  <div class="modal" id="power-modal" role="alertdialog" aria-modal="true" aria-labelledby="power-modal-title" hidden>
    <div class="modal-card">
      <h2 id="power-modal-title">Power Off?</h2>
      <p id="power-modal-body"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="power-modal-cancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="power-modal-confirm">Confirm</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <footer class="brand-footer" id="brand-footer">
    First Boot Linux <span id="fbl-version">0.1.0</span><br />
    Configured by <span class="retailer-name">Retailer Name</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
