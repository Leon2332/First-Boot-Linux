# First Boot live system — read from FBL-SYS /boot/grub/grub.cfg
# gcdx64.efi is monolithic; do not insmod from disk.
set default=0
set timeout=2
set timeout_style=menu

search --no-floppy --set=root --label FBL-SYS

menuentry "First Boot Linux" {
    linux /casper/vmlinuz boot=casper live-media=/dev/disk/by-label/FBL-SYS live-media-path=casper ignore_uuid nopersistent console=tty1 console=ttyS0,115200n8 ---
    initrd /casper/initrd
}

menuentry "First Boot Linux (safe graphics)" {
    linux /casper/vmlinuz boot=casper live-media=/dev/disk/by-label/FBL-SYS live-media-path=casper ignore_uuid nopersistent nomodeset console=tty1 console=ttyS0,115200n8 ---
    initrd /casper/initrd
}
