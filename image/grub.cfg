# First Boot live system — FBL-SYS /boot/grub/grub.cfg
# gcdx64.efi is monolithic; do not insmod from disk.
set default=0
set timeout=2
set timeout_style=menu

search --no-floppy --set=root --fs-uuid @SYS_UUID@
if [ ! -f /casper/vmlinuz ]; then
	search --no-floppy --set=root --label FBL-SYS
fi

menuentry "First Boot Linux" {
    linux /casper/vmlinuz boot=casper live-media=/dev/disk/by-uuid/@SYS_UUID@ live-media-path=casper ignore_uuid nopersistent noprompt console=tty1 console=ttyS0,115200n8 ---
    initrd /casper/initrd
}

menuentry "First Boot Linux (safe graphics)" {
    linux /casper/vmlinuz boot=casper live-media=/dev/disk/by-uuid/@SYS_UUID@ live-media-path=casper ignore_uuid nopersistent noprompt nomodeset console=tty1 console=ttyS0,115200n8 ---
    initrd /casper/initrd
}
