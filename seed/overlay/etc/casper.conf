export USERNAME="firstboot"
export USERFULLNAME="First Boot"
export HOST="firstboot"
# Must be Ubuntu or Debian: otherwise casper-helpers leaves MP_QUIET empty
# and `modprobe "${MP_QUIET}" -b overlay` becomes `modprobe ""` and panics.
export BUILD_SYSTEM="Ubuntu"
# Without FLAVOUR, casper overwrites USERNAME/HOST from the boot flavour.
export FLAVOUR="firstboot"
